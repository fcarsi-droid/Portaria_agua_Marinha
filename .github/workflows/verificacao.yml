name: Verificação do portal
on:
  pull_request:
  push:
    branches: [main, melhorias/portal-seguro]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-visual
          path: /tmp/portal-*.png
