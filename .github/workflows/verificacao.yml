name: Verificação do portal
on:
  pull_request:
  push:
    branches: [main, melhorias/portal-seguro]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste-ci
          POSTGRES_DB: portal_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: portal_teste
      PGUSER: postgres
      PGPASSWORD: teste-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Testar banco isolado
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020154639_portal_seguro_e_ciclo_moradores.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020154817_corrigir_alias_portal.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020173843_acesso_simples_portaria_links_seguros.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020181223_corrigir_variavel_papel_perfil_administrador.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020183541_restringir_aprovacao_cadastros_administracao.sql
          psql -v ON_ERROR_STOP=1 -f supabase/changes/suspensao-avisos.sql
          psql -v ON_ERROR_STOP=1 -f tests/acesso-simples.sql
          psql -v ON_ERROR_STOP=1 -f tests/suspensao-avisos.sql
      - run: npm test
      - name: Verificar função e prévia publicadas
        run: node tests/previa-publicada.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-visual
          path: /tmp/portal-*.png
